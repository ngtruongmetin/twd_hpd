services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: twd_hpd_backend
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/backend/.env:ro
      - twd_hpd_sqlite:/app/backend/data
    expose:
      - "5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: twd_hpd_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  twd_hpd_sqlite:
