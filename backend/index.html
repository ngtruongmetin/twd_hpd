<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mailer API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f8fafc;
      color: #1f2937;
    }
    h1 { margin-bottom: 8px; }
    p { margin-top: 0; color: #4b5563; }
    form {
      display: grid;
      gap: 12px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
    }
    input, textarea, button {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 700;
    }
    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>
  <h1>Mailer API Tester</h1>
  <p>Gửi email thử nghiệm tới API <strong>/api/v1/mail/sendto</strong>.</p>

  <form id="mailForm">
    <label>
      Email người nhận (to_email)
      <input type="email" id="to_email" name="to_email" value="example@gmail.com" required />
    </label>

    <label>
      Chủ đề (subject)
      <input type="text" id="subject" name="subject" value="Test gửi mail từ API" required />
    </label>

    <label>
      Nội dung text (content)
      <textarea id="content" name="content" required>Xin chào! Đây là email thử nghiệm từ công cụ kiểm thử mailer.</textarea>
    </label>

    <label>
      HTML (html)
      <textarea id="html" name="html" required><h2>Xin chào!</h2><p>Đây là email thử nghiệm từ công cụ kiểm thử mailer.</p><p><strong>Backend API đang hoạt động.</strong></p></textarea>
    </label>

    <button type="submit">Gửi mail</button>
  </form>

  <div id="statusBox" class="status"></div>

  <script>
    const form = document.getElementById('mailForm');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        to_email: document.getElementById('to_email').value,
        subject: document.getElementById('subject').value,
        content: document.getElementById('content').value,
        html: document.getElementById('html').value,
      };

      statusBox.className = 'status';
      statusBox.textContent = 'Đang gửi...';

      try {
        const res = await fetch('http://localhost:3000/api/v1/mail/sendto', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const text = await res.text();

        if (!res.ok) {
          throw new Error(text || 'Gửi mail thất bại');
        }

        statusBox.classList.add('success');
        statusBox.textContent = 'Gửi mail thành công! ' + text;
      } catch (err) {
        statusBox.classList.add('error');
        statusBox.textContent = 'Lỗi gửi mail: ' + err.message;
      }
    });
  </script>
</body>
</html>
